# The justfile drives whichever CONTAINER_ENGINE is set (docker or podman; with podman, prefer
# `--userns=keep-id` over the UID/GID args).
services:
  dev:
    build:
      context: docker/
      target: dev
      args:
        # Set BASE to the upstream digest in docker/Dockerfile for byte-for-byte CI parity.
        BASE: "${BASE:-debian:12-slim}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        COBALT_COMMIT: "${COBALT_COMMIT}"   # sourced from DEPS.pin by the justfile
    image: deckback-dev:latest
    volumes:
      - ${COBALT_SRC:-./cobalt}:/src
      - .:/work
      # sccache host bind-mount (SCCACHE_HOST_DIR in .env); must be writable by uid 1000 (`dev`).
      - ${SCCACHE_HOST_DIR:-./.sccache}:/cache/sccache
    working_dir: /work
    network_mode: host   # deploy/rsync to Deck + remote-debug tunnels from inside the container
    shm_size: 2g         # Chromium runtime wants real /dev/shm for smoke runs
    stdin_open: true
    tty: true

  # Flatpak packaging (Dockerfile `pack` stage). flatpak-builder's bubblewrap needs user + mount
  # namespaces inside the container: SYS_ADMIN + unconfined seccomp/apparmor grant them
  # (--disable-rofiles-fuse avoids needing /dev/fuse). The runtime/SDK persist via XDG_DATA_HOME.
  pack:
    build:
      context: docker/
      target: pack
      args:
        # `pack` has its own (non-Debian-12) base; see the pack stage in docker/Dockerfile.
        PACK_BASE: "${PACK_BASE:-debian:13-slim}"
        BASE: "${BASE:-debian:12-slim}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        COBALT_COMMIT: "${COBALT_COMMIT}"
    image: deckback-pack:latest
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      # Docker's masked /proc subpaths block the nested bwrap from mounting a fresh proc.
      - systempaths=unconfined
    environment:
      # flatpak --user installs into $XDG_DATA_HOME/flatpak; point it at the persisted bind-mount.
      XDG_DATA_HOME: /cache/flatpak/share
      XDG_CACHE_HOME: /cache/flatpak/cache
    volumes:
      - ${COBALT_SRC:-./cobalt}:/src
      - .:/work
      - ${FLATPAK_HOST_DIR:-./.flatpak-cache}:/cache/flatpak
    working_dir: /work
    network_mode: host
    stdin_open: true
    tty: true

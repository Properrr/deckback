# Free-runner checks. Each job installs its deps and runs scripts/preflight.sh <target>, the same
# script .githooks/pre-push runs locally.
name: lint
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check-permissions.sh compares the manifest against every release tag.
          fetch-depth: 0
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-pil
      - name: preflight (shell)
        run: ./scripts/preflight.sh shell

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install toolchain
        # clang-format is not installed here: preflight bootstraps the pinned version (lib.sh) into a
        # venv. The optional dev libs make CI build every feature; dbus-daemon runs platform_test.
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang python3-venv
          libsystemd-dev libcurl4-openssl-dev libpulse-dev libxcb1-dev dbus-daemon
      - name: preflight (launcher)
        run: ./scripts/preflight.sh launcher

  gn-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: preflight (gn)
        run: ./scripts/preflight.sh gn

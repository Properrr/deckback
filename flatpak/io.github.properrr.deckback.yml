# Flatpak manifest. The Chromium sandbox runs via zypak — never --no-sandbox. content_shell and its
# resources are staged prebuilt (flatpak/cobalt-prebuilt/, from scripts/flatpak.sh); zypak and the
# launcher build here against the SDK.
app-id: io.github.properrr.deckback
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: deckback
separate-locales: false

# Deliberately absent: --device=all, --no-sandbox, --filesystem=home, --socket=wayland
# (.internal/findings/durable/packaging-toolchain.md).
# NOTHING may be added without reading findings/durable/self-update.md: flatpak-portal refuses a
# self-update that adds a permission, stranding every existing install. scripts/check-permissions.sh
# gates this.
finish-args:
  # First stable flatpak that understands --device=input.
  - --require-version=1.16.0
  - --share=network
  - --socket=x11                 # Game Mode = gamescope Xwayland; content_shell --ozone-platform=x11
  # MIT-SHM for Chromium's X11 backend; without it every frame goes over the socket.
  - --share=ipc
  - --socket=pulseaudio          # PipeWire via pulse compat — playback AND mic capture (P5 voice)
  - --device=dri                 # GPU (VA-API decode, Phase 4)
  # evdev only (not --device=all): gamepad reader, FF_RUMBLE haptics.
  - --device=input
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  # Self-update: the Flatpak portal lets the app update only itself, from its own remote, without root.
  - --talk-name=org.freedesktop.portal.Flatpak
  # Game Mode has no Access-portal backend for the update consent dialog, so with self_update on the
  # launcher writes the consent (flatpak/updates=yes) itself and respects an explicit "no".
  - --talk-name=org.freedesktop.impl.portal.PermissionStore
  - --filesystem=xdg-run/pipewire-0:ro
  # content_shell is forked by the launcher, which finds it here (see the deckback wrapper).
  - --env=DECKBACK_COBALT_BIN=/app/bin/cobalt-zypak

modules:
  # zypak: Chromium sandbox helper for Flatpak. Plain Makefile build; provides /app/bin/zypak-wrapper.sh.
  - name: zypak
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS:-4}
      - make install
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53

  # Out-of-tree launcher (C++23). Builds against the SDK; installs /app/bin/deckback-launcher.
  - name: deckback-launcher
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF      # don't build the ctest binaries inside the Flatpak
      # flatpak-builder copies module sources FLAT, so config/scripts/ is added as a `dir` source at
      # ./scripts below and CMake globs it there.
      - -DDECKBACK_SCRIPTS_DIR=scripts
    sources:
      - type: dir
        path: ../launcher
      # VERSION lives above launcher/; without it CMake falls back to 0.0.0-dev.
      - type: file
        path: ../VERSION
        dest-filename: VERSION
      - type: dir
        path: ../config/scripts
        dest: scripts

  # Prebuilt content_shell runtime bundle. Chromium resolves its resources relative to the executable,
  # so the whole bundle lands in one dir (/app/cobalt).
  - name: cobalt
    buildsystem: simple
    build-commands:
      - mkdir -p /app/cobalt
      - cp -a . /app/cobalt/
    sources:
      - type: dir
        path: cobalt-prebuilt

  # App config, launch wrappers, desktop entry, icon and metainfo, gathered into flatpak/assets/ by
  # scripts/flatpak.sh.
  - name: deckback-assets
    buildsystem: simple
    build-commands:
      - install -Dm755 deckback.sh     /app/bin/deckback
      - install -Dm755 cobalt-zypak.sh /app/bin/cobalt-zypak
      - install -Dm644 app.json        /app/share/deckback/app.json
      - install -Dm644 steam_input.vdf /app/share/deckback/steam_input.vdf
      - install -Dm644 io.github.properrr.deckback.desktop      /app/share/applications/io.github.properrr.deckback.desktop
      - install -Dm644 io.github.properrr.deckback.svg          /app/share/icons/hicolor/scalable/apps/io.github.properrr.deckback.svg
      # Needs flatpak-builder >=1.4 (`appstreamcli compose`); scripts/flatpak.sh validates it first.
      - install -Dm644 io.github.properrr.deckback.metainfo.xml /app/share/metainfo/io.github.properrr.deckback.metainfo.xml
    sources:
      - type: dir
        path: assets
